name: nightly
on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: 要检查的提交，不填就是这个分支最新的
        required: false
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - sim/**

permissions:
  contents: read

jobs:
  # The real kills and the broken kernel conditions: too slow to hold up every merge, and nothing else runs them.
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:deep
  # The install says Node 24 or newer, and every other check runs on 24.
  newest-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:quick
      - run: sh scripts/install-smoke.sh
